<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Login Test Cases</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
<link rel="stylesheet" href="./stage.css" />
</head>
<body>
  <header class="top">
    <img src="/assets/taskify-2d-badge/taskify-mark-1-symbol.svg" alt="" />
    <div class="top-title" id="title"></div>
    <div class="top-meta" id="meta"></div>
  </header>

  <section class="browser">
    <div class="chrome">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <div class="address"><span class="lock">ⓘ</span><span id="url"></span><span class="caret" id="urlCaret"></span></div>
    </div>
    <iframe id="app" title="Taskify"></iframe>
    <div class="terminal" id="terminal">
      <div class="term-bar"><span>Terminal — practice server</span><span class="term-hint">backend/scripts/start-test-server.js</span></div>
      <pre id="termBody"></pre>
    </div>
  </section>

  <aside class="cases">
    <h2>Test cases</h2>
    <ol id="caseList"></ol>
    <div class="score" id="score"></div>
  </aside>

  <footer class="caption"><span id="caption"></span></footer>

  <div class="card" id="card"></div>
  <div class="ripple" id="ripple"></div>
  <div class="cursor" id="cursor">
    <svg width="30" height="30" viewBox="0 0 24 24"><path d="M4 2.5 19 13.2l-6.6 1.1 3.9 7-2.6 1.4-3.9-7L4.6 20z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>

<script src="./stage.js"></script>
</body>
</html>
