  <g fill="#AEB5C3"><rect x="130" y="330" width="90" height="6" rx="3"/><rect x="130" y="346" width="90" height="6" rx="3"/><rect x="130" y="362" width="90" height="6" rx="3"/><rect x="130" y="378" width="90" height="6" rx="3"/></g>
