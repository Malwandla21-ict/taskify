    <text x="210" y="210"><tspan fill="#C792EA">private double</tspan><tspan fill="#C7D2F0"> balance;</tspan></text>
    <text x="210" y="274"><tspan fill="#C792EA">public void</tspan><tspan fill="#82AAFF"> withdraw</tspan><tspan fill="#C7D2F0">(</tspan><tspan fill="#C792EA">double</tspan><tspan fill="#C7D2F0"> amt) {</tspan></text>
    <text x="240" y="306"><tspan fill="#C792EA">if</tspan><tspan fill="#C7D2F0"> (amt &gt; balance)</tspan></text>
    <text x="270" y="338"><tspan fill="#C792EA">throw new</tspan><tspan fill="#FFCB6B"> InsufficientFunds</tspan><tspan fill="#C7D2F0">();</tspan></text>
    <text x="240" y="370"><tspan fill="#C7D2F0">balance -= amt;</tspan></text>
    <text x="210" y="402" fill="#C7D2F0">}</text>
