<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEE4"/><stop offset="1" stop-color="#E4DCCB"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14306E"/><stop offset="1" stop-color="#0C1D4A"/></linearGradient>
    <linearGradient id="cover2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A7F60"/><stop offset="1" stop-color="#009B72"/></linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="430" width="800" height="170" fill="#D9CFBA"/>
  <ellipse cx="410" cy="470" rx="290" ry="34" fill="url(#shadow)"/>
  <!-- lower book lying flat -->
  <rect x="170" y="400" width="470" height="56" rx="6" fill="url(#cover2)"/>
  <rect x="182" y="408" width="452" height="40" rx="3" fill="#F7F3EA"/>
  <g stroke="#E2DACA" stroke-width="2"><line x1="190" y1="416" x2="628" y2="416"/><line x1="190" y1="424" x2="628" y2="424"/><line x1="190" y1="432" x2="628" y2="432"/><line x1="190" y1="440" x2="628" y2="440"/></g>
  <rect x="170" y="400" width="470" height="10" rx="5" fill="#0B8A66"/>
  <!-- standing book -->
  <g transform="rotate(-4 400 260)">
    <rect x="262" y="72" width="292" height="340" rx="8" fill="#F4EFE4"/>
    <rect x="250" y="66" width="292" height="340" rx="8" fill="url(#cover)"/>
    <rect x="250" y="66" width="26" height="340" rx="6" fill="#081638"/>
    <text x="300" y="130" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600" fill="#F5B400" letter-spacing="3">5TH EDITION</text>
    <text x="300" y="178" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">Engineering</text>
    <text x="300" y="220" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">Mathematics</text>
    <!-- graph motif -->
    <g transform="translate(300 250)">
      <rect width="200" height="110" rx="8" fill="#13285E"/>
      <g stroke="#2A4486" stroke-width="1.5"><line x1="0" y1="55" x2="200" y2="55"/><line x1="100" y1="0" x2="100" y2="110"/></g>
      <path d="M8 96 C 50 96, 60 20, 100 55 S 160 10, 192 18" fill="none" stroke="#F5B400" stroke-width="4" stroke-linecap="round"/>
      <path d="M8 30 C 60 30, 90 90, 192 86" fill="none" stroke="#3FD3A6" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
    </g>
    <text x="300" y="388" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" fill="#A9B6D6">K. A. Stroud</text>
  </g>
  <!-- sticky note -->
  <g transform="rotate(7 600 330)"><rect x="560" y="300" width="98" height="86" rx="4" fill="#F5B400"/><text x="572" y="338" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#5C4300">MATH</text><text x="572" y="360" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#5C4300">1A/1B</text></g>
</svg>
