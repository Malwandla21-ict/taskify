<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1310" width="1600" height="1310" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0C1D4A"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0C1D4A; }
      .subtitle { font-size: 12.5px; fill: #4B5563; }
      .panel { font-size: 15px; font-weight: 700; fill: #0C1D4A; }
      .panel-sub { font-size: 11px; fill: #4B5563; }
      .state { fill: #EEF4FF; stroke: #0C1D4A; stroke-width: 1.6; }
      .state-done { fill: #E6F6F0; stroke: #009B72; stroke-width: 1.8; }
      .state-bad { fill: #FDECEC; stroke: #E03A3E; stroke-width: 1.8; }
      .composite { fill: #FFFBEB; stroke: #B38900; stroke-width: 1.6; }
      .name { font-size: 14.5px; font-weight: 700; fill: #0C1D4A; text-anchor: middle; }
      .db { font-size: 10.5px; fill: #4B5563; text-anchor: middle; }
      .edge { fill: none; stroke: #0C1D4A; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge-legacy { fill: none; stroke: #687280; stroke-width: 1.4; stroke-dasharray: 6,4; marker-end: url(#arrow); }
      .label { font-size: 11px; fill: #111827; }
      .guard { font-size: 11px; fill: #0072CE; }
      .effect { font-size: 11px; fill: #009B72; }
      .note { fill: #FFFFFF; stroke: #687280; stroke-width: 1.2; }
      .note-text { font-size: 10.5px; fill: #374151; }
      .legend { font-size: 11px; fill: #374151; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1310" fill="#FFFFFF"/>
  <text class="title" x="40" y="44">Taskify — Rental state transition diagram</text>
  <text class="subtitle" x="40" y="66">UML state machines. A. one booking (equipment_bookings.status, with picked_up_at and condition_status for the inner states). B. one extension request (booking_extensions.status).</text>
  <text class="panel" x="40" y="104">A. Rental booking</text>
  <text class="panel-sub" x="40" y="121">Request first, pay later: nothing is paid until the owner approves. Payments are a demo. Deposits, early-return refunds and late fees are not in effect.</text>

  <!-- ===== A. Booking ===== -->
  <circle cx="190" cy="160" r="10" fill="#0C1D4A"/>

  <rect class="state" x="80" y="230" width="220" height="64" rx="14"/>
  <text class="name" x="190" y="258">Requested</text>
  <text class="db" x="190" y="276">status Pending · payment Unpaid</text>

  <rect class="state" x="400" y="230" width="220" height="64" rx="14"/>
  <text class="name" x="510" y="258">Awaiting Payment</text>
  <text class="db" x="510" y="276">approved · dates held</text>

  <!-- Composite Confirmed -->
  <rect class="composite" x="840" y="170" width="380" height="380" rx="18"/>
  <text x="858" y="194" font-size="13" font-weight="700" fill="#8A6A00">Confirmed</text>
  <text x="858" y="211" font-size="10.5" fill="#8A6A00">paid (demo) · dates held · payment Held</text>

  <rect class="state" x="920" y="240" width="230" height="64" rx="14"/>
  <text class="name" x="1035" y="268">Awaiting Collection</text>
  <text class="db" x="1035" y="286">picked_up_at not set</text>

  <rect class="state" x="920" y="440" width="230" height="64" rx="14"/>
  <text class="name" x="1035" y="468">Out on Rent</text>
  <text class="db" x="1035" y="486">picked up · return deadline set</text>

  <rect class="state" x="920" y="650" width="230" height="64" rx="14"/>
  <text class="name" x="1035" y="678">Return Check</text>
  <text class="db" x="1035" y="696">status Returned · condition Pending</text>

  <rect class="state-done" x="1320" y="650" width="220" height="64" rx="14"/>
  <text class="name" x="1430" y="678">Completed</text>
  <text class="db" x="1430" y="696">Returned · condition OK</text>

  <rect class="state-bad" x="920" y="830" width="230" height="64" rx="14"/>
  <text class="name" x="1035" y="858">Damage Reported</text>
  <text class="db" x="1035" y="876">Returned · condition Damaged</text>

  <rect class="state-bad" x="1320" y="830" width="220" height="64" rx="14"/>
  <text class="name" x="1430" y="858">Damage Confirmed</text>
  <text class="db" x="1430" y="876">kept on the renter's record</text>

  <rect class="state-bad" x="80" y="830" width="540" height="64" rx="14"/>
  <text class="name" x="350" y="858">Cancelled</text>
  <text class="db" x="350" y="876">cancel_reason recorded · anything paid is refunded (demo)</text>

  <!-- finals -->
  <circle cx="350" cy="960" r="12" fill="#FFFFFF" stroke="#0C1D4A" stroke-width="2"/>
  <circle cx="350" cy="960" r="7" fill="#0C1D4A"/>
  <circle cx="1430" cy="590" r="12" fill="#FFFFFF" stroke="#0C1D4A" stroke-width="2"/>
  <circle cx="1430" cy="590" r="7" fill="#0C1D4A"/>
  <circle cx="1430" cy="960" r="12" fill="#FFFFFF" stroke="#0C1D4A" stroke-width="2"/>
  <circle cx="1430" cy="960" r="7" fill="#0C1D4A"/>

  <!-- R1 request -->
  <path class="edge" d="M190,170 L190,228"/>
  <text class="label" x="200" y="190">renter requests dates <tspan fill="#0072CE">[dates free; item value within</tspan></text>
  <text class="guard" x="200" y="204">their trust level]</text>
  <text class="effect" x="200" y="218">/ nothing paid; terms + policy version saved</text>

  <!-- R2 Requested -> Awaiting Payment -->
  <path class="edge" d="M300,262 L398,262"/>
  <text class="label" x="350" y="314" text-anchor="middle">owner approves</text>
  <text class="guard" x="350" y="328" text-anchor="middle">[dates still free]</text>
  <text class="effect" x="350" y="342" text-anchor="middle">/ pay-by time set</text>
  <text class="effect" x="350" y="356" text-anchor="middle">(24 h or start day)</text>

  <!-- R3 legacy: paid-up-front request approved -->
  <path class="edge-legacy" d="M110,230 L110,146 L1120,146 L1120,238"/>
  <text class="label" x="575" y="140" text-anchor="middle" fill="#4B5563">owner approves a request that was paid up front (bookings made before October 2026)</text>

  <!-- R4 Awaiting Payment -> Awaiting Collection -->
  <path class="edge" d="M620,262 L918,262"/>
  <text class="label" x="740" y="226" text-anchor="middle">renter accepts the current</text>
  <text class="label" x="740" y="240" text-anchor="middle">terms and pays (demo)</text>
  <text class="guard" x="740" y="254" text-anchor="middle">[before pay-by time; dates free]</text>
  <text class="effect" x="740" y="282" text-anchor="middle">/ payment Held; overlapping</text>
  <text class="effect" x="740" y="296" text-anchor="middle">requests declined</text>

  <!-- R5 Requested -> Cancelled -->
  <path class="edge" d="M190,294 L190,828"/>
  <text class="label" x="200" y="470">owner declines</text>
  <text class="label" x="200" y="484">· renter cancels</text>
  <text class="label" x="200" y="498">· no answer in 48 h or</text>
  <text class="label" x="200" y="512">  start date passed</text>
  <text class="label" x="200" y="526">· another renter paid</text>
  <text class="label" x="200" y="540">  for those dates</text>

  <!-- R6 Awaiting Payment -> Cancelled -->
  <path class="edge" d="M510,294 L510,828"/>
  <text class="label" x="500" y="470" text-anchor="end">pay-by time passes</text>
  <text class="label" x="500" y="484" text-anchor="end">· renter cancels</text>
  <text class="label" x="500" y="498" text-anchor="end">· owner can't go ahead</text>
  <text class="effect" x="500" y="512" text-anchor="end">/ nothing to refund</text>

  <!-- R7 Awaiting Collection -> Cancelled -->
  <path class="edge" d="M960,304 L960,330 L720,330 L720,862 L622,862"/>
  <text class="label" x="730" y="600">renter cancels</text>
  <text class="label" x="730" y="614">· owner can't hand it over</text>
  <text class="label" x="730" y="628">· renter refuses a faulty</text>
  <text class="label" x="730" y="642">  item (admins get a report)</text>
  <text class="effect" x="730" y="656">/ full refund (demo)</text>

  <!-- R8 Awaiting Collection -> Out on Rent -->
  <path class="edge" d="M1035,304 L1035,438"/>
  <text class="label" x="1045" y="364">renter confirms pickup with</text>
  <text class="label" x="1045" y="378">photos and the condition</text>

  <!-- R9 extension (on the composite) -->
  <path class="edge" d="M1220,300 L1270,300 L1270,360 L1222,360"/>
  <text class="label" x="1280" y="300">extension paid (see B)</text>
  <text class="guard" x="1280" y="314">[asked before the deadline;</text>
  <text class="guard" x="1280" y="328">owner approved; days free]</text>
  <text class="effect" x="1280" y="342">/ end date and return</text>
  <text class="effect" x="1280" y="356">deadline move</text>

  <!-- R10 Out on Rent -> Return Check -->
  <path class="edge" d="M1035,504 L1035,648"/>
  <text class="label" x="1045" y="574">renter or owner records the return with photos</text>
  <text class="effect" x="1045" y="588">/ rent released to owner (demo); time and minutes</text>
  <text class="effect" x="1045" y="602">late recorded — no late fee</text>

  <!-- R11 Return Check -> Completed -->
  <path class="edge" d="M1150,682 L1318,682"/>
  <text class="label" x="1234" y="658" text-anchor="middle">owner confirms</text>
  <text class="label" x="1234" y="672" text-anchor="middle">the condition</text>
  <text class="effect" x="1234" y="700" text-anchor="middle">/ any deposit released</text>

  <!-- R12 Return Check -> Damage Reported -->
  <path class="edge" d="M1035,714 L1035,828"/>
  <text class="label" x="1025" y="766" text-anchor="end">owner reports damage</text>
  <text class="effect" x="1025" y="780" text-anchor="end">/ report filed for admins</text>

  <!-- R13 Damage Reported -> Completed (not at fault) -->
  <path class="edge" d="M1150,846 L1250,846 L1250,740 L1400,740 L1400,716"/>
  <text class="label" x="1262" y="792">admin: renter not</text>
  <text class="label" x="1262" y="806">at fault</text>
  <text class="effect" x="1262" y="820">/ damage mark removed</text>

  <!-- R14 Damage Reported -> Damage Confirmed -->
  <path class="edge" d="M1150,878 L1318,878"/>
  <text class="label" x="1234" y="900" text-anchor="middle">admin: damage confirmed</text>
  <text class="effect" x="1234" y="914" text-anchor="middle">/ nothing charged</text>

  <!-- finals -->
  <path class="edge" d="M1430,650 L1430,604"/>
  <path class="edge" d="M1430,894 L1430,946"/>
  <path class="edge" d="M350,894 L350,946"/>

  <!-- Note: time events while out on rent -->
  <rect class="note" x="1260" y="420" width="320" height="104" rx="4"/>
  <path d="M1260,470 L1152,470" stroke="#687280" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
  <text class="note-text" x="1274" y="442" font-weight="700">Time events while Out on Rent (no state change)</text>
  <text class="note-text" x="1274" y="460">24 h before the deadline: renter reminded</text>
  <text class="note-text" x="1274" y="476">deadline passed: renter and owner told ("Overdue")</text>
  <text class="note-text" x="1274" y="492">72 h after the deadline: admins asked to follow up</text>
  <text class="note-text" x="1274" y="508">Each is sent once. Nothing is ever charged.</text>

  <!-- ===== B. Extension ===== -->
  <line x1="40" y1="1000" x2="1560" y2="1000" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text class="panel" x="40" y="1024">B. Extension request</text>
  <text class="panel-sub" x="40" y="1041">Only on a Confirmed, paid booking. Until it is Paid, the original return deadline applies.</text>

  <rect class="composite" x="130" y="1066" width="690" height="96" rx="16"/>
  <text x="812" y="1080" font-size="11" font-weight="700" fill="#8A6A00" text-anchor="end">Open</text>

  <circle cx="60" cy="1112" r="10" fill="#0C1D4A"/>
  <rect class="state" x="150" y="1080" width="200" height="64" rx="14"/>
  <text class="name" x="250" y="1108">Requested</text>
  <text class="db" x="250" y="1126">owner to answer</text>

  <rect class="state" x="560" y="1080" width="210" height="64" rx="14"/>
  <text class="name" x="665" y="1108">Awaiting Payment</text>
  <text class="db" x="665" y="1126">extra days held</text>

  <rect class="state-done" x="1050" y="1080" width="200" height="64" rx="14"/>
  <text class="name" x="1150" y="1108">Paid</text>
  <text class="db" x="1150" y="1126">booking extended</text>

  <rect class="state-bad" x="1300" y="1040" width="180" height="40" rx="12"/>
  <text class="name" x="1390" y="1065">Declined</text>
  <rect class="state-bad" x="1300" y="1164" width="180" height="40" rx="12"/>
  <text class="name" x="1390" y="1189">Cancelled</text>
  <rect class="state-bad" x="1300" y="1218" width="180" height="40" rx="12"/>
  <text class="name" x="1390" y="1243">Expired</text>

  <!-- create -->
  <path class="edge" d="M70,1112 L148,1112"/>
  <text class="label" x="40" y="1180">renter asks for a later end date</text>
  <text class="guard" x="40" y="1194">[before the deadline; one open</text>
  <text class="guard" x="40" y="1208">request; extra days free]</text>
  <text class="effect" x="40" y="1222">/ extra rent + fee shown</text>

  <!-- Requested -> Awaiting Payment -->
  <path class="edge" d="M350,1102 L558,1102"/>
  <text class="label" x="454" y="1094" text-anchor="middle">owner approves <tspan fill="#0072CE">[days still free]</tspan></text>
  <text class="effect" x="454" y="1122" text-anchor="middle">/ pay-by time set</text>

  <!-- Awaiting Payment -> Paid -->
  <path class="edge" d="M770,1102 L1048,1102"/>
  <text class="label" x="935" y="1094" text-anchor="middle">renter pays (demo)</text>
  <text class="guard" x="935" y="1080" text-anchor="middle">[in time; days free]</text>
  <text class="effect" x="935" y="1120" text-anchor="middle">/ booking end date</text>
  <text class="effect" x="935" y="1134" text-anchor="middle">and deadline move</text>

  <!-- Requested -> Declined -->
  <path class="edge" d="M250,1080 L250,1058 L1298,1058"/>
  <text class="label" x="900" y="1050" text-anchor="middle">owner declines</text>

  <!-- Open -> Cancelled -->
  <path class="edge" d="M600,1162 L600,1184 L1298,1184"/>
  <text class="label" x="940" y="1176" text-anchor="middle">renter withdraws, or the rental ends (item returned or booking cancelled)</text>

  <!-- Open -> Expired -->
  <path class="edge" d="M330,1162 L330,1238 L1298,1238"/>
  <text class="label" x="800" y="1230" text-anchor="middle">time runs out <tspan fill="#0072CE">[no answer before the return deadline, or not paid by the pay-by time]</tspan></text>

  <!-- Legend -->
  <text class="legend" x="40" y="1286"><tspan fill="#111827">event</tspan> <tspan fill="#0072CE">[guard]</tspan> <tspan fill="#009B72">/ effect</tspan></text>
  <path d="M190,1282 L240,1282" class="edge-legacy"/>
  <text class="legend" x="248" y="1286">older bookings only</text>
  <rect x="400" y="1272" width="34" height="20" rx="6" class="composite"/>
  <text class="legend" x="442" y="1286">composite state (a transition from its edge applies to every state inside)</text>
</svg>
