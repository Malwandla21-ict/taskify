<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taskify — Conversation</title>
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/layout-v2.css" />
</head>
<body class="dashboard-body">
<div id="navbarContainer"></div>
<div class="dashboard-container">
  <a href="./messages.html" class="back-link"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back to Messages</a>
  <section class="section" style="padding-top:8px;">
    <div id="conversationHeader" class="form-panel" style="margin-bottom:16px;"></div>
    <div id="messagesThread" class="form-panel" style="min-height:320px;max-height:520px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;"></div>
    <form id="messageForm" class="form-panel" style="margin-top:16px;display:flex;gap:10px;align-items:flex-start;">
      <textarea id="messageBody" placeholder="Type a message…" style="min-height:48px;flex:1;" required></textarea>
      <button type="submit" class="primary-button" style="width:auto;padding:12px 20px;">
        <i class="ti ti-send" aria-hidden="true"></i>
      </button>
    </form>
  </section>
</div>
<div id="toastContainer" class="toast-container"></div>
<script src="./js/api.js"></script>
<script src="./js/helpers.js"></script>
<script src="./js/navbar.js"></script>
<script src="./js/conversation.js"></script>
</body>
</html>
