<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taskify — Set New Password</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-container" style="max-width:460px;grid-template-columns:1fr;">
    <div class="auth-right">
      <div class="logo-row" style="margin-bottom:26px;">
        <img src="./assets/logo/ump logoT.png" alt="UMP Logo" class="ump-logo" />
        <div class="logo-text" style="font-size:24px;">Taskify</div>
      </div>
      <h1 style="font-size:24px;font-weight:800;margin-bottom:4px;">Set a new password</h1>
      <p class="auth-subtitle">Choose a new password for your account.</p>
      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword"><i class="ti ti-lock" aria-hidden="true"></i> New Password</label>
          <div class="password-input-wrap">
            <input type="password" id="newPassword" placeholder="At least 8 characters, with a letter and a number" required />
            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword"><i class="ti ti-lock-check" aria-hidden="true"></i> Confirm Password</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPassword" placeholder="Repeat your new password" required />
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show confirm password">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="primary-button" id="submitButton">
          <i class="ti ti-check" aria-hidden="true"></i> Reset password
        </button>
      </form>
      <div class="auth-footer">
        <a href="./login.html">Back to login</a>
      </div>
      <p id="formMessage" style="margin-top:14px;text-align:center;font-weight:600;font-size:13px;"></p>
    </div>
  </div>
</div>
<script src="./js/api.js"></script>
<script>
  const resetForm    = document.getElementById("resetForm");
  const submitButton = document.getElementById("submitButton");
  const formMessage  = document.getElementById("formMessage");

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  function showMessage(msg, color = "red") {
    formMessage.textContent = msg;
    formMessage.style.color = color;
  }

  document.querySelectorAll(".password-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const icon  = btn.querySelector("i");
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      icon.className = showing ? "ti ti-eye" : "ti ti-eye-off";
    });
  });

  if (!token) {
    showMessage("This reset link is missing its token. Please request a new one from the login page.");
    resetForm.querySelector("button[type='submit']").disabled = true;
  }

  resetForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const newPassword     = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
      showMessage("Password must be at least 8 characters and include a letter and a number.");
      return;
    }
    if (newPassword !== confirmPassword) {
      showMessage("Passwords do not match.");
      return;
    }

    const originalHtml = submitButton.innerHTML;
    submitButton.disabled = true;
    submitButton.innerHTML = `<i class="ti ti-loader" aria-hidden="true"></i> Resetting…`;
    showMessage("Resetting your password…", "#687280");

    try {
      const response = await apiRequest("/auth/reset-password", "POST", { token, newPassword });
      showMessage(response.message || "Password reset. Redirecting to login…", "var(--ump-green)");
      setTimeout(() => { window.location.href = "./login.html"; }, 1800);
    } catch (error) {
      showMessage(error.message || "This link is invalid or has expired.", "red");
      submitButton.disabled = false;
      submitButton.innerHTML = originalHtml;
    }
  });
</script>
</body>
</html>
