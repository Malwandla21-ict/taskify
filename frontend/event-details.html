<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Details — Taskify</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body class="dashboard-body">
<div id="navbarContainer"></div>
<div class="dashboard-container">
  <section class="section">
    <a href="./events.html" class="back-link"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back to Events</a>
    <div class="section-header">
      <div>
        <h2><i class="ti ti-calendar-event" aria-hidden="true"></i> Event Details</h2>
        <p>Review the event before RSVPing</p>
      </div>
    </div>
    <div id="eventDetailsContainer" class="form-panel">
      <div class="empty-state"><div class="empty-state-icon"><i class="ti ti-calendar-event" aria-hidden="true"></i></div><h3>Loading event…</h3></div>
    </div>
  </section>
</div>
<div id="overlay"></div>
<div id="toastContainer" class="toast-container"></div>
<div id="profileModal">
  <h2><i class="ti ti-user" aria-hidden="true"></i> User Trust Profile</h2>
  <div id="profileContent"><p>Loading profile...</p></div>
  <button type="button" id="closeProfileModal" class="secondary-button" style="margin-top:14px;">
    <i class="ti ti-x" aria-hidden="true"></i> Close
  </button>
</div>
<script src="./js/api.js"></script>
<script src="./js/helpers.js"></script>
<script src="./js/navbar.js"></script>
<script src="./js/event-details.js"></script>
</body>
</html>
