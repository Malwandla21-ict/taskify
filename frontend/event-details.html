<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon/favicon-48x48.png" />
  <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" />
  <title>Campus Marketplace — Taskify</title>
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/profile.css" />
  <link rel="stylesheet" href="./css/layout-v2.css" />
</head>
<body class="dashboard-body">
<div id="navbarContainer"></div>
<div class="dashboard-container">
  <section class="section">
    <button type="button" class="back-link" id="backButton"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back to Campus Marketplace</button>
    <div class="section-header">
      <div>
        <h2><i class="ti ti-building-store" aria-hidden="true"></i> Campus Marketplace</h2>
        <p>Check the details before you RSVP</p>
      </div>
    </div>
    <div id="eventDetailsContainer" class="form-panel detail-shell" data-skeleton="detail">
      <div class="empty-state"><div class="empty-state-icon"><i class="ti ti-loader" aria-hidden="true"></i></div><h3>Loading…</h3></div>
    </div>
  </section>
</div>
<div id="overlay"></div>
<div id="toastContainer" class="toast-container"></div>
<div id="profileModal">
  <h2><i class="ti ti-user" aria-hidden="true"></i> User Trust Profile</h2>
  <div id="profileContent"><p>Loading profile...</p></div>
  <button type="button" id="closeProfileModal" class="secondary-button" style="margin-top:14px;">
    <i class="ti ti-x" aria-hidden="true"></i> Close
  </button>
</div>
<script src="./js/api.js"></script>
<script src="./js/helpers.js"></script>
<script src="./js/navbar.js"></script>
<script src="./js/event-details.js"></script>
</body>
</html>
