<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskify — UMP Student Marketplace</title>
  <meta name="description" content="Taskify is a student marketplace for the University of Mpumalanga — post and accept tasks, rent equipment, buy and sell with fellow students." />
  <!-- Google Search Console site-ownership verification. Google's verifier
       just fetches this page's raw HTML and looks for this tag — it does
       not run the JS redirect below or follow the meta refresh — so this
       works even though visitors immediately get sent on to login.html. -->
  <meta name="google-site-verification" content="bztFoZo3qrLzf-U6zISyNu4TSoZ7Tkxbs3vGWAoSxxo" />
  <!-- No app logic lives here — this is just the front door. Everything in
       the app requires login, so the root URL simply hands visitors to the
       login page (new students go on to Register from there). Having a
       real page at "/" also means the bare domain doesn't 404, which
       matters once this is submitted to Google Search Console. -->
  <meta http-equiv="refresh" content="0; url=./login.html" />
  <link rel="canonical" href="./login.html" />
  <script>window.location.replace("./login.html");</script>
</head>
<body>
  <p>Redirecting to <a href="./login.html">Taskify login</a>…</p>
</body>
</html>
