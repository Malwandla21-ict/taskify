<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taskify — Notifications</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body class="dashboard-body">
<div id="navbarContainer"></div>
<div class="dashboard-container">
  <div class="hero-section-simple">
    <div class="hero-badge"><i class="ti ti-bell" aria-hidden="true"></i> Notifications</div>
    <h1>Your Taskify updates</h1>
    <p>Track task, rental, sales and review activity in one place.</p>
  </div>
  <section class="section">
    <div class="section-header">
      <div>
        <h2><i class="ti ti-bell" aria-hidden="true"></i> Recent Notifications</h2>
        <p>Unread notifications appear first</p>
      </div>
    </div>
    <div id="notificationsContainer" style="display:flex;flex-direction:column;gap:10px;">
      <div class="empty-state">
        <div class="empty-state-icon"><i class="ti ti-loader" aria-hidden="true"></i></div>
        <h3>Loading notifications…</h3>
      </div>
    </div>
  </section>
</div>
<div id="toastContainer" class="toast-container"></div>
<script src="./js/api.js"></script>
<script src="./js/helpers.js"></script>
<script src="./js/navbar.js"></script>
<script src="./js/notifications.js"></script>
</body>
</html>
