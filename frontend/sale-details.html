<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon/favicon-48x48.png" />
  <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" />
  <title>Sale Item Details — Taskify</title>
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/profile.css" />
  <link rel="stylesheet" href="./css/layout-v2.css" />
</head>
<body class="dashboard-body">
<div id="navbarContainer"></div>
<div class="dashboard-container">
  <section class="section">
    <button type="button" class="back-link" id="backButton"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back to Sales</button>
    <div class="section-header">
      <div>
        <h2><i class="ti ti-shopping-bag" aria-hidden="true"></i> Sale Item Details</h2>
        <p>Review the item before contacting the seller</p>
      </div>
    </div>
    <div id="saleDetailsContainer" class="form-panel detail-shell">
      <div class="empty-state"><div class="empty-state-icon"><i class="ti ti-loader" aria-hidden="true"></i></div><h3>Loading item…</h3></div>
    </div>
  </section>
</div>
<div id="overlay"></div>
<div id="toastContainer" class="toast-container"></div>
<div id="profileModal">
  <h2><i class="ti ti-user" aria-hidden="true"></i> User Trust Profile</h2>
  <div id="profileContent"><p>Loading profile...</p></div>
  <button type="button" id="closeProfileModal" class="secondary-button" style="margin-top:14px;">
    <i class="ti ti-x" aria-hidden="true"></i> Close
  </button>
</div>
<!-- Taskify Protection (DEMO escrow) — filled in by sale-details.js -->
<div id="buyModal">
  <h2><i class="ti ti-shield-lock" aria-hidden="true"></i> Buy with Taskify Protection</h2>
  <div id="buyModalBody"></div>
  <div class="form-row">
    <button type="button" id="closeBuyModal" class="secondary-button">
      <i class="ti ti-x" aria-hidden="true"></i> Cancel
    </button>
    <button type="button" id="simulateBuyButton" class="primary-button">
      <i class="ti ti-shield-check" aria-hidden="true"></i> Simulate Payment
    </button>
  </div>
</div>
<!-- Buyer or seller: the meetup failed or the handover went wrong (order becomes Disputed). -->
<div id="saleProblemModal" role="dialog" aria-modal="true" aria-labelledby="saleProblemTitle">
  <h2 id="saleProblemTitle"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Report a problem with this sale</h2>
  <p class="pay-note" id="saleProblemIntro"></p>
  <form id="saleProblemForm">
    <div class="form-group">
      <label for="saleProblemCategory">What went wrong?</label>
      <select id="saleProblemCategory" required></select>
    </div>
    <div class="form-group">
      <label for="saleProblemReason">Describe what happened</label>
      <textarea id="saleProblemReason" rows="4" minlength="10" maxlength="500" required
        placeholder="e.g. We agreed to meet at the library at 2pm and I waited 30 minutes."></textarea>
    </div>
    <p id="saleProblemMessage" class="pay-note" style="color:var(--ump-red);"></p>
    <div class="form-row">
      <button type="button" id="cancelSaleProblem" class="secondary-button">
        <i class="ti ti-x" aria-hidden="true"></i> Cancel
      </button>
      <button type="submit" id="submitSaleProblem" class="primary-button" style="background:var(--ump-red);">
        <i class="ti ti-send" aria-hidden="true"></i> Report Problem
      </button>
    </div>
  </form>
</div>
<script src="./js/api.js"></script>
<script src="./js/helpers.js"></script>
<script src="./js/taskify-motion.js"></script>
<script src="./js/navbar.js"></script>
<script src="./js/offers.js"></script>
<script src="./js/sale-details.js"></script>
</body>
</html>
